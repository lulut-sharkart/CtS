<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Conquer the Star</title>
<style>
:root{--bg:#05060f;--p1:#0d1226;--p2:#161d3a;--ln:#2a3566;--tx:#e8ecff;--mu:#8d97c4;--ac:#6ea8ff;--gd:#fbbf24;--gm:#5eead4;--rd:#f43f5e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:#0a0f20;border:1px solid var(--ln);border-radius:10px;padding:10px;width:100%}
.btn{background:linear-gradient(#3b5bdb,#2b3fa8);border:1px solid #6ea8ff55;border-radius:10px;padding:9px 14px;font-weight:600}
.btn.sm{padding:6px 10px;font-size:13px}.btn.gold{background:linear-gradient(#f59e0b,#b45309)}.btn.red{background:linear-gradient(#e11d48,#9f1239)}.btn.gray{background:#232b52}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{flex:1;background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:8px 6px;font-size:13px;white-space:nowrap}
.tabs button.on{background:#3b5bdb;border-color:#6ea8ff}
.foot{text-align:center;color:var(--mu);font-size:12px;padding:6px}
.av{position:relative;width:52px;height:52px;border-radius:50%;border:2px solid var(--ac);background:var(--p2);font-size:28px;padding:0;flex:none}
.av span{position:absolute;right:-4px;bottom:-4px;background:#3b5bdb;border-radius:8px;font-size:11px;padding:1px 5px;border:1px solid #fff3}
.pinfo{flex:1;min-width:0}.pinfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pinfo small{color:var(--mu);font-size:12px}
.bar{height:6px;background:#0a0f20;border-radius:4px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6ea8ff,#c084fc);width:0}
.cur{display:flex;flex-direction:column;gap:2px;font-size:13px;text-align:right}
.sk{position:relative;width:58px;height:58px;border-radius:50%;background:var(--p2);border:2px solid var(--ln);font-size:26px;overflow:hidden;padding:0}
.sk .cdov{position:absolute;left:0;right:0;bottom:0;background:#000a;height:0}
.sk small{position:absolute;bottom:1px;left:0;right:0;font-size:9px}
#modal{position:absolute;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end}
#modal .box{width:100%;max-height:92%;background:var(--p1);border-top:2px solid var(--ac);border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--ln);font-size:17px}
.mh button{background:none;border:none;font-size:20px}
#mb{padding:12px;overflow-y:auto;flex:1}
.card{display:flex;gap:10px;align-items:center;background:var(--p2);border:1px solid var(--ln);border-left:4px solid var(--rc,#999);border-radius:12px;padding:10px;margin-bottom:8px}
.card .ic{font-size:30px;width:44px;text-align:center;flex:none}.card .in{flex:1;min-width:0;font-size:13px}
.card .in b{font-size:14px}.card .in small{color:var(--mu);display:block}
.chip{display:inline-block;background:#0a0f20;border:1px solid var(--ln);border-radius:8px;padding:2px 6px;font-size:11px;margin:2px 3px 0 0}
.rb{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;color:#000;font-weight:700;margin-left:4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.chips button{flex:none;background:var(--p2);border:1px solid var(--ln);border-radius:16px;padding:4px 10px;font-size:12px}
.chips button.on{background:#3b5bdb}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.st{background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:8px;font-size:13px}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}.avs button{font-size:24px;background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:6px 0}.avs button.on{border-color:var(--gd)}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row>*{flex:1}.row label{flex:0 0 38%;font-size:13px;color:var(--mu)}
h4{margin:12px 0 6px;color:var(--ac)}
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#111a3acc;border:1px solid var(--ac);padding:8px 14px;border-radius:12px;z-index:50;font-size:14px;max-width:90%;text-align:center;pointer-events:none;opacity:0;transition:.25s}
#toast.show{opacity:1}
.me{outline:2px solid var(--gd)}
/* ===== TAMPILAN BARU ===== */
:root{--glass:rgba(18,26,58,.72);--glow:0 0 18px rgba(110,168,255,.35)}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes shine{from{background-position:0 0}to{background-position:200% 0}}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}15%{transform:translate(-50%,-50%) scale(1.1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}
.btn{border-radius:14px;box-shadow:0 4px 0 #1b2766,0 6px 14px #0008;transition:transform .08s,box-shadow .08s,filter .2s;text-shadow:0 1px 2px #0008}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1b2766}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn.gold{box-shadow:0 4px 0 #78350f,0 6px 14px #0008}.btn.gold:active{box-shadow:0 1px 0 #78350f}
.btn.red{box-shadow:0 4px 0 #6b0f2a,0 6px 14px #0008}.btn.gray{box-shadow:0 3px 0 #11162f}
.av{border:2px solid transparent;background:linear-gradient(var(--p2),var(--p2)) padding-box,linear-gradient(135deg,#6ea8ff,#c084fc,#fbbf24) border-box;box-shadow:var(--glow);transition:transform .15s}
.av:active{transform:scale(.92)}
.bar{height:8px;border-radius:6px;box-shadow:inset 0 1px 3px #000}.bar i{border-radius:6px;box-shadow:0 0 8px #c084fc;transition:width .4s}
.cur span{background:#0a0f2088;border:1px solid var(--ln);border-radius:20px;padding:2px 10px;font-weight:600}
#stagebar .dots{display:flex;gap:4px}#stagebar .dots i{width:14px;height:6px;border-radius:3px;background:#2a3566}#stagebar .dots i.on{background:linear-gradient(90deg,#fbbf24,#f97316);box-shadow:0 0 8px #f97316}
#stagebar .pw{color:var(--gd);font-size:12px}
.sk{border-width:3px;box-shadow:0 0 14px #0009,inset 0 0 12px #0008;transition:transform .12s}.sk:active{transform:scale(.9)}
#modal{backdrop-filter:blur(3px);animation:none}
#modal .box{background:linear-gradient(180deg,#151d45,#0d1226 30%);border-top:2px solid transparent;border-image:linear-gradient(90deg,#6ea8ff,#c084fc,#fbbf24) 1;animation:rise .28s ease-out;box-shadow:0 -10px 40px #000a}
.mh{background:#0a0f2066;font-weight:700;letter-spacing:.4px}
.mh button{width:34px;height:34px;border-radius:50%;background:#232b52}
#mb::-webkit-scrollbar{width:6px}#mb::-webkit-scrollbar-thumb{background:#34408a;border-radius:3px}
.card{background:linear-gradient(135deg,color-mix(in srgb,var(--rc,#556) 18%,#161d3a),#161d3a 60%);border-radius:14px;box-shadow:0 2px 10px #0006,inset 0 0 0 1px #ffffff0d;transition:transform .12s}
.card:hover{transform:translateX(2px)}
.card .ic{background:#0a0f2099;border-radius:12px;padding:6px 0;box-shadow:0 0 12px color-mix(in srgb,var(--rc,#556) 55%,transparent);border:1px solid color-mix(in srgb,var(--rc,#556) 60%,transparent)}
.rb{box-shadow:0 0 8px currentColor;letter-spacing:.5px}
.chips button,.tabs button{transition:.15s;border-radius:12px}
.tabs button.on,.chips button.on{background:linear-gradient(135deg,#4f46e5,#7c3aed);border-color:#a78bfa;box-shadow:0 0 12px #7c3aed88}
.st{background:linear-gradient(135deg,#1b2552,#131a3b);border-radius:12px}
h4{display:flex;align-items:center;gap:8px}h4::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--ln),transparent)}
#banner{position:absolute;left:50%;top:38%;z-index:60;pointer-events:none;font-size:26px;font-weight:900;text-align:center;color:#fde68a;text-shadow:0 0 20px #f59e0b,0 3px 0 #78350f;opacity:0;white-space:nowrap}
#banner.show{animation:pop 2s ease-out}
.me{box-shadow:0 0 0 2px var(--gd),0 0 18px #fbbf2466}

#toast{position:absolute;left:50%;transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--ac);padding:8px 14px;border-radius:16px;box-shadow:0 8px 24px #000a;z-index:50;font-size:14px;max-width:90%;text-align:center;pointer-events:none;opacity:0;transition:.25s}
/* ===== LAYAR PENUH, SEMUA RASIO ===== */
:root{--pad:clamp(132px,34vmin,196px);--sk:clamp(54px,13vmin,72px)}
#app{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);box-shadow:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(-30deg)}4%{opacity:1}18%{opacity:0;transform:translate(-460px,266px) rotate(-30deg)}100%{opacity:0}}
.cosmos{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;background:radial-gradient(900px 520px at 15% -10%,#4c1d9577,transparent 60%),radial-gradient(800px 520px at 100% 100%,#0e749066,transparent 60%),radial-gradient(600px 400px at 50% 55%,#1e1b4b66,transparent),#04050d}
.cosmos::before,.cosmos::after{content:"";position:fixed;inset:-10%;pointer-events:none;background-image:radial-gradient(2px 2px at 12% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 12%,#9cc2ff,transparent),radial-gradient(2px 2px at 40% 66%,#fff,transparent),radial-gradient(1.5px 1.5px at 86% 58%,#e0b3ff,transparent),radial-gradient(1px 1px at 8% 86%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 92%,#fff,transparent),radial-gradient(1px 1px at 28% 38%,#fff,transparent),radial-gradient(1.5px 1.5px at 92% 28%,#fff,transparent);animation:twinkle 4s infinite}
.cosmos::after{animation-delay:2s;transform:scale(1.35) rotate(9deg)}
.shoot{position:fixed;width:130px;height:2px;background:linear-gradient(90deg,#fff,transparent);opacity:0;pointer-events:none;animation:shoot 7s linear infinite}
.shoot.s1{top:10%;left:78%}.shoot.s2{top:34%;left:96%;animation-delay:3.5s}
.emblem{width:92px;height:92px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:46px;position:relative;isolation:isolate;box-shadow:0 0 44px #7c3aed88}
.emblem::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(#6ea8ff,#c084fc,#fbbf24,#6ea8ff);z-index:-2;animation:spin 6s linear infinite}
.emblem::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#241a5e,#0a0e22);z-index:-1}
.emblem span{animation:floaty 3s ease-in-out infinite;filter:drop-shadow(0 0 14px #fbbf24aa)}
.ttl,#auth h1{margin:0;text-align:center;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#6ea8ff,#c084fc,#fbbf24,#6ea8ff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite;filter:drop-shadow(0 0 18px #6ea8ff55)}
#auth h1{font-size:clamp(30px,8vmin,42px)}
.ttl{font-size:clamp(36px,10vmin,58px);line-height:1}
/* login */
#auth{display:flex;padding:calc(18px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}
.authWrap{position:relative;z-index:1;margin:auto;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;flex-direction:column;gap:8px}
.sub{text-align:center;color:var(--mu);margin:0;font-size:14px}
.card-auth{background:rgba(14,20,48,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #ffffff1f;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px #000a,inset 0 1px 0 #ffffff14}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:#0a0f20;border-radius:14px;padding:4px;border:1px solid var(--ln)}

.fld{position:relative;display:flex;align-items:center}

#btnAuth{padding:14px;font-size:17px;font-weight:800;letter-spacing:.5px;background:linear-gradient(135deg,#6366f1,#a855f7,#ec4899);border-color:#ffffff33}

.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f2937;border:0;border-radius:14px;padding:12px;font-weight:700;box-shadow:0 4px 0 #9ca3af,0 8px 18px #0006;transition:transform .08s,box-shadow .08s}

#stagebar{display:flex;justify-content:center;align-items:center;gap:10px;background:none;padding:0 10px 6px;font-weight:700;font-size:13px;color:var(--tx);text-shadow:0 1px 3px #000;pointer-events:none}
#pad{position:absolute;left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));width:var(--pad);height:var(--pad);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:4px;z-index:6;touch-action:none;user-select:none;-webkit-user-select:none}
#pad button{background:rgba(18,26,58,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:2px solid #ffffff2a;border-radius:16px;font-size:calc(var(--pad)/6.5);color:#dbe4ff;display:grid;place-items:center;padding:0;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 3px 0 #0008;transition:transform .05s,background .1s}
#pad button.on{background:rgba(110,168,255,.55);border-color:#9cc2ff;transform:scale(.93)}
#pad [data-d=up]{grid-area:1/2}#pad [data-d=left]{grid-area:2/1}#pad [data-d=right]{grid-area:2/3}#pad [data-d=down]{grid-area:3/2}
#pad .pc{grid-area:2/2;border-radius:50%;background:#ffffff12;margin:6px}
#skillbar{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:10px;align-items:flex-end;padding:0;background:none}
.sk{width:var(--sk);height:var(--sk)}
@media (max-aspect-ratio:1/1){#skillbar{flex-direction:column}}
@media (max-height:430px){.ib{width:34px;height:34px;font-size:16px}#top .av{width:40px;height:40px;font-size:20px}}
/* modal & toast menyesuaikan layar */
#modal{justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
#modal .box{max-width:640px}
@media (max-height:520px) and (orientation:landscape){#modal{align-items:center}#modal .box{max-height:94%;border-radius:18px;border:2px solid var(--ac);border-image:none}}
#toast{top:calc(env(safe-area-inset-top) + 84px)}
/* landscape pendek: login 2 kolom */
@media (max-height:520px) and (orientation:landscape){
  .authWrap{max-width:780px;display:grid;grid-template-columns:1fr 1fr;align-items:center;column-gap:26px;row-gap:6px}
  .authWrap .foot{grid-column:1/-1}.emblem{width:70px;height:70px;font-size:34px}
}
@media (min-width:900px) and (min-height:640px){.authWrap{max-width:440px}}
/* cara bermain */
.how .hr{display:flex;align-items:center;gap:12px;margin:8px 0;font-size:14px}
.how .hr span{flex:1}
kbd{display:inline-block;min-width:56px;text-align:center;background:#0a0f20;border:1px solid var(--ln);border-bottom-width:3px;border-radius:8px;padding:4px 8px;font:600 13px system-ui;color:var(--tx);flex:none}
/* menu layar penuh */
#modal{align-items:stretch;justify-content:stretch;padding:0;background:var(--bg)}
#modal .box,#modal .box{max-width:none;width:100%;height:100%;max-height:100%;border-radius:0;border:0;border-image:none;border-top:0;animation:none}
#modal .mh{padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 12px calc(14px + env(safe-area-inset-left));font-size:18px}
#mb{padding:14px max(14px,calc((100% - 760px)/2)) calc(20px + env(safe-area-inset-bottom))}
@media (max-height:520px) and (orientation:landscape){#modal .box{max-height:100%;border-radius:0;border:0}}
/* ===== v2: tombol menu utama seragam ===== */
:root{--btnbg:linear-gradient(180deg,#1d3474,#10214f);--btnbd:#4468c4;--btntx:#e6edff}
#home .pcard,#home .hbtn,#home .eqbox,#home .chtype,#home .playBtn{background:var(--btnbg);border:1.5px solid var(--btnbd);color:var(--btntx);box-shadow:0 4px 0 #07102b,0 8px 18px #0007;text-shadow:0 1px 2px #0008}
#home .eqbox .eqnm{color:#a9bbef}
#home .playBtn{animation:pulse 2s ease-in-out infinite;font-size:20px}
#home :is(.pcard,.hbtn,.eqbox,.chtype,.playBtn):hover{filter:brightness(1.15);border-color:#8fb4ff}
#home .chtype{font-size:22px;font-weight:700}
.heroBox{left:calc(50% - 125px);top:calc(50% - 270px);width:250px;height:495px;pointer-events:none}
.heroBox img{position:static;display:block;width:100%;height:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 0 18px var(--aura,#0000))}
.heroEmpty{position:absolute;inset:60px 10px 70px;border:2px dashed var(--aura,#6ea8ff);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;background:radial-gradient(circle,#1d347455,transparent 70%)}
.heroEmpty b{font-size:34px}.heroEmpty small{color:var(--mu);font-size:14px}
#stage.portrait .heroBox{left:calc(50% - 125px);top:auto;bottom:421px}
/* ===== v2: popup besar, tidak penuh ===== */
#modal{align-items:center;justify-content:center;background:#02051299;backdrop-filter:blur(4px);padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
#modal .box{width:min(94%,920px);height:92%;max-width:920px;max-height:760px;border-radius:22px;border:2px solid var(--btnbd,#4468c4);background:linear-gradient(180deg,#152250,#0b1230 35%);box-shadow:0 24px 70px #000c,0 0 30px #4468c455;overflow:hidden;animation:rise .25s ease-out}
#modal .mh{padding:12px 16px}
#mb{padding:14px max(14px,calc((100% - 780px)/2)) 20px}
@media (max-height:520px) and (orientation:landscape){#modal .box{width:min(90%,820px);height:100%;max-height:100%;border-radius:18px;border:2px solid #4468c4}#modal .mh{padding:7px 14px}}
/* detail barang */
#detail{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#000a;padding:16px}
#detail .dbox{width:min(100%,430px);max-height:100%;overflow-y:auto;background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 28%,#152250),#0b1230 45%);border:2px solid var(--rc);border-radius:20px;padding:16px;box-shadow:0 0 34px color-mix(in srgb,var(--rc) 55%,transparent);animation:rise .2s ease-out}
.dic{font-size:56px;text-align:center;line-height:1.2}.dname{text-align:center;font-size:19px;font-weight:800}
.drow{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:9px;font-size:14px}.drow:nth-child(odd){background:#ffffff0d}
.up{color:#4ade80}.down{color:#fb7185}
.dact{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.dact .btn{flex:1;min-width:100px}
.card[data-info],.card[data-inv]{cursor:pointer}
/* mode, wilayah, karakter */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{border:2px solid #ffffff33;border-radius:18px;padding:18px 14px;text-align:center;font-weight:600;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.mode b{font-size:42px;font-weight:400}.mode strong{font-size:19px}.mode small{color:#e6edffcc;font-size:13px}
.locs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.loc{text-align:left;border:2px solid var(--lc);border-radius:14px;padding:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--lc) 35%,#0b1230),#0b1230)}
.loc strong{display:block;font-size:15px}.loc small{color:#cdd6ff;display:block;font-size:12px;margin-top:3px}
.loc:disabled{filter:grayscale(1);opacity:.45;cursor:not-allowed}
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.chr{border:2px solid var(--aura);border-radius:16px;padding:12px;background:#0a1130;display:flex;flex-direction:column;gap:8px;text-align:center}
.chr .pv{height:170px;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:13px}.chr .pv img{max-width:100%;max-height:100%}
.chr small{color:var(--mu)}
#splash{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#011235;padding:20px;text-align:center}
.dact{position:sticky;bottom:-16px;padding:8px 0;margin-bottom:-8px;background:#0b1230}
@media (max-height:520px){.dic{font-size:34px}#detail{padding:8px}#detail .dbox{padding:10px 14px 16px}.drow{padding:4px 10px}}
</style>
</head>
<body>
<div id="app">

<div id="splash"><div class="emblem"><span>🌟</span></div><b id="spMsg">Memuat akun...</b><button class="btn" id="spRetry" hidden>Coba lagi</button><button class="btn gray" id="spOther" hidden>Masuk akun lain</button></div>
<section id="auth" class="cosmos" hidden>
  <div class="shoot s1"></div><div class="shoot s2"></div>
  <div class="authWrap">
    <div class="brand">
      <div class="emblem"><span>🌟</span></div>
      <h1>Conquer the Star</h1>
      <p class="sub">Kultivasi, kumpulkan kekuatan, taklukkan bintang.</p>
    </div>
    <div class="card-auth">
      <div class="seg" id="seg"><i class="pill"></i><button id="tabLogin" class="on">Masuk</button><button id="tabReg">Daftar</button></div>
      <div class="fld"><span class="ico">👤</span><input id="fUser" placeholder="Username (3-16: huruf, angka, spasi, _)" autocomplete="username" maxlength="16"></div>
      <div class="fld"><span class="ico">🔒</span><input id="fPass" type="password" placeholder="Kata sandi (min. 6 karakter)" autocomplete="current-password"><button type="button" id="eye" class="eye" aria-label="Tampilkan kata sandi">👁️</button></div>
      <button id="btnAuth" class="btn">Masuk</button>
      <div class="or"><span>atau</span></div>
      <button id="btnGoogle" class="gbtn"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Lanjut dengan Google</button>
      <div id="authMsg"></div>
    </div>
    <div class="foot">© SharkArt.evo Education</div>
  </div>
</section>

<section id="home" hidden>
  <div id="homeSafe"><div id="stage">
    <div class="pcard" id="hCard">
      <button id="hAv" class="av" aria-label="Profil">🥷<span id="hLv">1</span></button>
      <div class="pinfo"><b id="hName"></b><small id="hRealm"></small><div class="bar"><i id="hExp"></i></div></div>
      <div class="cur"><span>🪙 <b id="hGold">0</b></span><span>💎 <b id="hGems">0</b></span></div>
    </div>
    <button class="hbtn hset" data-m="set"><b>⚙️</b>Pengaturan</button>
    <button class="hbtn" id="mShop" data-m="shop"><b>🛒</b>Toko</button>
    <button class="hbtn" id="mInv" data-m="inv"><b>🎒</b>Penyimpanan</button>
    <button class="hbtn mini" id="mRank" data-m="rank"><b>🏆</b>Peringkat</button>
    <button class="hbtn mini" id="mAch" data-m="ach"><b>🎖️</b>Pencapaian</button>
    <div class="heroBox" id="heroBox"></div>
    <button class="chtype" id="btnChar">Karakter</button>
    <div class="equip">
      <button class="eqbox" data-eqtab="weapon"><span class="eqic" id="eqWi"></span><span class="eqnm" id="eqWn"></span>Senjata</button>
      <button class="eqbox" data-eqtab="armor"><span class="eqic" id="eqAi"></span><span class="eqnm" id="eqAn"></span>Armor</button>
      <button class="eqbox" data-eqtab="skill"><span class="eqic" id="eqSi"></span><span class="eqnm" id="eqSn"></span>Skill Aktif</button>
    </div>
    <button id="btnPlay" class="playBtn">▶ MAIN</button>
  </div></div>
</section>

<section id="game" hidden>
  <div id="cvwrap"><canvas id="cv"></canvas></div>
  <div id="hudTop">
    <header id="top">
      <button id="avBtn" class="av">🥷<span id="lvBadge">1</span></button>
      <div class="pinfo"><b id="pName"></b><small id="pRealm"></small><div class="bar"><i id="expBar"></i></div></div>
      <div class="cur"><span>🪙 <b id="gold">0</b></span><span>💎 <b id="gems">0</b></span></div>
      <button id="btnFS" class="ib" aria-label="Layar penuh">⛶</button>
      <button id="btnPause" class="ib" aria-label="Menu">☰</button>
    </header>
    <div id="stagebar"></div>
  </div>
  <div id="pad">
    <button data-d="up" aria-label="Atas">▲</button>
    <button data-d="left" aria-label="Kiri">◀</button>
    <div class="pc"></div>
    <button data-d="right" aria-label="Kanan">▶</button>
    <button data-d="down" aria-label="Bawah">▼</button>
  </div>
  <div id="skillbar"></div>
</section>

<div id="modal" hidden><div class="box"><div class="mh"><b id="mt"></b><button id="mx">✕</button></div><div id="mb"></div></div></div>
<div id="detail" hidden></div>
<div id="toast"></div>
<div id="banner"></div>
</div>

let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
function banner(t){const b=$('#banner');b.textContent=t;b.classList.remove('show');void b.offsetWidth;b.classList.add('show');try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}}

function modal(title,html){if($('#detail'))$('#detail').hidden=true;if(typeof inputReset==='function')inputReset();$('#mt').textContent=title;$('#mb').innerHTML=html;$('#modal').hidden=false;$('#mb').scrollTop=0;return $('#mb');}

$('#mx').onclick=closeModal;

let AC;
function beep(f=440,d=.06,type='square',v=.03){
  if(S.P?.settings?.sfx===false)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}
}
async function rpc(name,args){const {data,error}=await sb.rpc(name,args||{});if(error){toast(error.message);throw error;}return data;}

const need = L => Math.floor(80*Math.pow(L,1.7));
function curLevel(){let L=S.P.level,e=Number(S.P.exp)+S.pending.exp;const mx=S.cfg.max_level;while(L<mx&&e>=need(L)){e-=need(L);L++;}return{L,e};}
function realmOf(L){const r=S.cfg.realms;const i=Math.min(r.length-1,Math.floor((L-1)/9));return{i,name:r[i],s:((L-1)%9)+1};}
const invById = id => S.inv.find(x=>x.id===id);
const itemStat = (inv,k) => Math.round((S.items[inv.item_id][k]||0)*(1+0.25*(inv.level-1)));
function passiveTotals(){
  const eq=S.P.equipment||{},t={};
  for(const id of [eq.weapon,eq.armor]){const inv=id&&invById(id);if(!inv)continue;
    for(const p of inv.passives||[])t[p.el]=(t[p.el]||0)+p.pow*(1+0.05*(inv.level-1));}
  return t;
}
function heroStats(){
  const {L}=curLevel(),rm=realmOf(L),up=S.P.upgrades||{},eq=S.P.equipment||{};
  const w=eq.weapon&&invById(eq.weapon),a=eq.armor&&invById(eq.armor),pt=passiveTotals(),rb=1+0.25*rm.i;
  let atk=(10+L*4)*rb*(1+0.05*(up.atk||0))+(w?itemStat(w,'atk'):0);
  let hp=(100+L*30)*rb*(1+0.05*(up.hp||0))+(a?itemStat(a,'hp'):0);
  let def=(3+L*1.2)*rb*(1+0.05*(up.def||0))+(a?itemStat(a,'def'):0);
  atk*=1+(pt.api||0)/100;hp*=1+(pt.air||0)/100;def*=1+(pt.tanah||0)/100;
  const ch=curChar();atk*=ch.atk;
  const hs={L,atk,hp,def,pt,
    crit:Math.min(80,5+ch.crit+0.3*(up.crit||0)+(pt.petir||0)),critDmg:150+(pt.void||0),
    aspd:Math.min(3.5,1.2*ch.aspd*(1+(pt.angin||0)/100)),regen:0.005+(pt.tumbuhan||0)*0.002,
    red:Math.min(60,pt.logam||0),weak:Math.min(60,pt.es||0),steal:Math.min(50,pt.kegelapan||0)/100,gold:1+(pt.cahaya||0)/100,
    wRar:w?S.items[w.item_id].rarity:null,aRar:a?S.items[a.item_id].rarity:null};
  hs.power=Math.floor(atk*3+hp*0.3+def*2);
  return hs;
}
function refreshStats(){S.hs=heroStats();if(B.hp>S.hs.hp)B.hp=S.hs.hp;}
const upCost = (inv) => {const it=S.items[inv.item_id];const base=it.currency==='gold'?it.price:it.price*1000;return Math.max(1,Math.floor(base*0.1*Math.pow(inv.level,1.4)*S.cfg.upgrade_cost_mult));};
const statCost = lvl => Math.floor(100*Math.pow(1.15,lvl)*S.cfg.upgrade_cost_mult);
const rbadge = r => `<span class="rb" style="background:${RCOL[r]}">${r.toUpperCase()}</span>`;
const passChips = ps => (ps||[]).map(p=>`<span class="chip" style="border-color:${EL[p.el]?.c}">${EL[p.el]?.i} ${EL[p.el]?.n} ${(p.pow).toFixed(1)}%</span>`).join('');
function itemStatsTxt(it,lvl=1){
  const m=1+0.25*(lvl-1),o=[];
  if(it.atk)o.push('⚔️ '+Math.round(it.atk*m));if(it.hp)o.push('❤️ '+Math.round(it.hp*m));if(it.def)o.push('🛡️ '+Math.round(it.def*m));
  if(it.type==='skill')o.push(`${EL[it.element]?.i||''} x${(it.skill_mult*(1+0.2*(lvl-1))).toFixed(2)} dmg • CD ${it.cooldown}s`);
  return o.join('  ');
}

/* ============ SINKRONISASI ============ */
async function sync(){
  while(S.syncing)await sleep(80);
  if(!S.P)return;const sn={...S.pending};
  if(!sn.gold&&!sn.exp&&!sn.kills&&S.stage===S.P.stage)return;
  S.syncing=true;S.pending={gold:0,exp:0,kills:0};
  const {data,error}=await sb.rpc('save_progress',{p_exp:sn.exp,p_gold:sn.gold,p_kills:sn.kills,p_stage:S.stage});
  S.syncing=false;
  if(error){S.pending.gold+=sn.gold;S.pending.exp+=sn.exp;S.pending.kills+=sn.kills;return;}
  S.P=data;hud();
}
setInterval(()=>{if(S.P)sync();},15000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)sync();});
window.addEventListener('pagehide',()=>{sync();});

const lastP={up:-1e9,down:-1e9,left:-1e9,right:-1e9};
function inputReset(){
  B.held.left=B.held.right=false;B.downHeld=false;B.proneMode=false;
  document.querySelectorAll('#pad button').forEach(b=>b.classList.remove('on'));
}
function press(d){
  if(!S.P||$('#game').hidden||!$('#modal').hidden)return;
  const now=performance.now(),dbl=now-lastP[d]<DBL;lastP[d]=dbl?-1e9:now;
  if(d==='up'){
    if(B.hy<=0&&B.vy<=0){B.vy=dbl?JV_H:JV_N;B.hy=.01;B.jt=dbl?2:1;B.jage=0;beep(dbl?700:520,.08,'triangle',.04);}
    else if(dbl&&B.jt===1&&B.jage<.35){B.vy=JV_H;B.jt=2;beep(760,.08,'triangle',.04);}
  }else if(d==='down'){
    B.downHeld=true;
    if(B.hy>0)B.vy=Math.min(B.vy,-900);
    else if(dbl){B.proneMode=true;B.proneT=.6;}
    else B.crouchT=.25;
  }else{
    B.held[d]=true;
    if(dbl&&B.dashCd<=0)startDash(d==='right'?1:-1);
  }
}
function release(d){if(d==='down'){B.downHeld=false;B.proneMode=false;}else if(d==='left'||d==='right')B.held[d]=false;}
document.querySelectorAll('#pad button').forEach(b=>{
  const d=b.dataset.d,up=()=>{b.classList.remove('on');release(d);};
  b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(_){}b.classList.add('on');press(d);});
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
const KEYS={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};

/* ---- Update ---- */
function update(dt){
  if(!S.hs||B.over)return;B.t+=dt;const H=S.hs;updExtra(dt);if(B.over)return;
  B.dashCd=Math.max(0,B.dashCd-dt);B.inv=Math.max(0,B.inv-dt);B.hurtInv=Math.max(0,B.hurtInv-dt);
  B.proneT=Math.max(0,B.proneT-dt);B.crouchT=Math.max(0,B.crouchT-dt);B.jage+=dt;

  cx.globalAlpha=1;cx.restore();
  if(B.combo>1){const y=gy*.34;cx.textAlign='left';cx.font=`900 ${Math.min(30,20+B.combo/2)}px system-ui`;cx.strokeStyle='#000b';cx.lineWidth=5;const s=`COMBO x${B.combo}`;cx.strokeText(s,18,y);cx.fillStyle=`hsl(${(B.combo*25)%360} 95% 68%)`;cx.fillText(s,18,y);
    cx.font='bold 12px system-ui';cx.fillStyle='#fde68a';cx.fillText(`Gold +${Math.min(B.combo,25)*2}%`,18,y+17);cx.fillRect(18,y+23,90*Math.max(0,B.comboT/4),3);}
  if(B.rage>0){cx.textAlign='left';cx.font='bold 12px system-ui';cx.fillStyle='#fecdd3';cx.fillText(`⚔ Amukan ${B.rage.toFixed(1)}s`,18,gy*.34+40);}
  if(B.hitFlash>0){cx.fillStyle=`rgba(244,63,94,${B.hitFlash*.7})`;cx.fillRect(0,0,W,Hh);}
}

    ${S.P.is_admin?'<button class="btn gold" id="sAdm" style="width:100%;margin-top:10px">🛠️ Panel Admin</button>':''}
    <button class="btn red" id="sOut" style="width:100%;margin-top:10px">Keluar</button>
    <p style="text-align:center;color:var(--mu);font-size:12px;margin-top:14px">Conquer the Star<br>© SharkArt.evo Education</p>`);
  $('#sSave').onclick=async()=>{try{S.P=await rpc('update_profile_info',{p_settings:{...st,sfx:$('#sSfx').value==='1',quality:$('#sQ').value}});resize();toast('Tersimpan');}catch(e){}};
  $('#sNameBtn').onclick=async()=>{try{S.P=await rpc('update_profile_info',{p_username:$('#sName').value.trim()});hud();toast('Nama diubah');}catch(e){}};
  $('#sOut').onclick=async()=>{await sync();await sb.auth.signOut({scope:'local'});S.P=null;closeModal();showAuth('Kamu telah keluar.');};

  if(S.P.is_admin)$('#sAdm').onclick=()=>openAdmin();
}

/* ============ ADMIN ============ */
const ADM={
  profiles:{pk:'id',order:'level',desc:true,noNew:true,noDel:true,cols:[['username','text'],['avatar','text'],['level','int'],['exp','int'],['gold','int'],['gems','int'],['stage','int'],['best_stage','int'],['kills','int'],['upgrades','json'],['is_admin','bool'],['banned','bool']],title:r=>`${r.avatar} ${r.username} (Lv${r.level})`},
  items:{pk:'id',order:'sort',cols:[['id','text'],['type','sel:weapon,armor,skill'],['name','text'],['rarity','sel:'+RAR.join(',')],['icon','text'],['element','text'],['atk','int'],['hp','int'],['def','int'],['skill_mult','num'],['cooldown','num'],['price','int'],['currency','sel:gold,gems'],['enabled','bool'],['sort','int']],title:r=>`${r.icon} ${r.name} [${r.type}/${r.rarity}]`},
  achievements:{pk:'id',order:'target',cols:[['id','text'],['name','text'],['descr','text'],['metric','sel:kills,stage,level,items'],['target','int'],['reward_gold','int'],['reward_gems','int'],['enabled','bool']],title:r=>`${r.name} (${r.metric}≥${r.target})`},
  game_config:{pk:'key',order:'key',cols:[['key','text'],['value','json']],title:r=>`${r.key} = ${JSON.stringify(r.value).slice(0,40)}`}
};
function openAdmin(tab='profiles'){
  const names={profiles:'Pemain',items:'Barang',achievements:'Pencapaian',game_config:'Konfigurasi',grant:'Beri Item'};
  const b=modal('Panel Admin',`<div class="tabs">${Object.entries(names).map(([k,v])=>`<button data-t="${k}" class="${k===tab?'on':''}">${v}</button>`).join('')}</div><div id="adBody"></div>`);
  b.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>openAdmin(x.dataset.t));
  tab==='grant'?adminGrant():adminList(tab);
}
async function adminList(t,q=''){
  const c=ADM[t],box=$('#adBody');box.innerHTML='<p>Memuat...</p>';
  const {data,error}=await sb.from(t).select('*').order(c.order,{ascending:!c.desc}).limit(300);
  if(error){box.innerHTML='<p>'+esc(error.message)+'</p>';return;}
  box.innerHTML=`<div class="row"><input id="adQ" placeholder="Cari..." value="${esc(q)}">${c.noNew?'':'<button class="btn sm" id="adNew" style="flex:0 0 auto">+ Baru</button>'}</div>`+
    data.filter(r=>c.title(r).toLowerCase().includes(q.toLowerCase())).map((r,i)=>`<div class="card" style="--rc:#556"><div class="in"><b>${esc(c.title(r))}</b></div><button class="btn sm" data-e="${esc(r[c.pk])}">Edit</button></div>`).join('');
  $('#adQ').oninput=e=>adminList(t,e.target.value);
  box.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>adminForm(t,data.find(r=>String(r[c.pk])===x.dataset.e)));
  if($('#adNew'))$('#adNew').onclick=()=>adminForm(t,null);
}
function adminForm(t,row){
  const c=ADM[t],isNew=!row,box=$('#adBody');
  box.innerHTML=c.cols.map(([k,ty])=>{
    const v=row?row[k]:(ty==='bool'?true:ty==='json'?'{}':'');const ro=!isNew&&k===c.pk;let f;
    if(ty==='bool')f=`<select data-k="${k}"><option value="true" ${v?'selected':''}>Ya</option><option value="false" ${!v?'selected':''}>Tidak</option></select>`;
    else if(ty.startsWith('sel:'))f=`<select data-k="${k}">${ty.slice(4).split(',').map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
    else if(ty==='json')f=`<textarea data-k="${k}" rows="3">${esc(typeof v==='string'?v:JSON.stringify(v))}</textarea>`;
    else f=`<input data-k="${k}" type="${ty==='text'?'text':'number'}" step="any" value="${esc(v??'')}" ${ro?'disabled':''}>`;
    return`<div class="row"><label>${k}</label>${f}</div>`}).join('')+
    `<div class="row"><button class="btn" id="afS">Simpan</button>${(!isNew&&!c.noDel)?'<button class="btn red" id="afD">Hapus</button>':''}<button class="btn gray" id="afC">Batal</button></div>`;
  $('#afC').onclick=()=>adminList(t);
  $('#afS').onclick=async()=>{
    const o={};try{c.cols.forEach(([k,ty])=>{const el=box.querySelector(`[data-k="${k}"]`);let v=el.value;
      if(ty==='bool')v=v==='true';else if(ty==='int'||ty==='num')v=Number(v);else if(ty==='json')v=JSON.parse(v);else if(v===''&&k==='element')v=null;o[k]=v;});}catch(e){return toast('Format tidak valid: '+e.message);}
    let r;if(t==='profiles'){delete o.id;r=await sb.from(t).update(o).eq('id',row.id);}else r=await sb.from(t).upsert(o);
    if(r.error)return toast(r.error.message);toast('Tersimpan');
    if(t==='profiles'&&row.id===S.user.id)await refreshProfile();else if(t!=='profiles')await loadAll().then(()=>{refreshStats();renderSkillBar();hud();});
    adminList(t);};
  if($('#afD'))$('#afD').onclick=async()=>{if(!confirm('Hapus data ini?'))return;const r=await sb.from(t).delete().eq(c.pk,row[c.pk]);if(r.error)return toast(r.error.message);toast('Dihapus');await loadAll();adminList(t);};
}
async function adminGrant(){
  const box=$('#adBody');
  const {data}=await sb.from('profiles').select('id,username').order('username').limit(300);
  box.innerHTML=`<div class="row"><label>Pemain</label><select id="gU">${(data||[]).map(p=>`<option value="${p.id}">${esc(p.username)}</option>`).join('')}</select></div>
  <div class="row"><label>Barang</label><select id="gI">${Object.values(S.items).sort((a,b)=>a.type.localeCompare(b.type)||RAR.indexOf(a.rarity)-RAR.indexOf(b.rarity)).map(i=>`<option value="${i.id}">${esc(i.name)} [${i.type}/${i.rarity}]</option>`).join('')}</select></div>
  <button class="btn" id="gB" style="width:100%">Beri barang</button>`;
  $('#gB').onclick=async()=>{try{await rpc('admin_grant_item',{p_user:$('#gU').value,p_item:$('#gI').value});toast('Barang diberikan');if($('#gU').value===S.user.id)refreshInv();}catch(e){}};
}

/* ============ KARAKTER ============ */
const CHARS={
  pendekar:{n:'Pendekar',d:'Petarung seimbang. Tanpa bonus khusus.',aura:'#6ea8ff',atk:1,aspd:1,crit:0,blade:0},
  luofeng:{n:'Luo Feng',d:'Serangan +15%, kecepatan serang +10%, kritis +5%. Bilah terbang menyerang tiap 3 detik.',aura:'#fbbf24',atk:1.15,aspd:1.1,crit:5,blade:3,file:'luofeng.png'}
};
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true;}catch(e){return false;}};
const charId=()=>CHARS[S.P?.settings?.char]?S.P.settings.char:'pendekar';
const curChar=()=>CHARS[charId()];
const charImg=id=>id==='pendekar'?DEFAULT_HERO:(lsGet('cts_img_'+id)||CHARS[id].file);
async function saveSettings(patch){
  S.P.settings={...(S.P.settings||{}),...patch};
  try{S.P=await rpc('update_profile_info',{p_settings:S.P.settings});return true;}catch(e){return false;}
}
function heroPicture(box,id){
  const c=CHARS[id],img=document.createElement('img');img.alt=c.n;img.draggable=false;
  img.onerror=()=>{box.innerHTML=`<div class="heroEmpty"><b>${c.n}</b><small>Gambar belum dipasang.<br>Ketuk "Karakter" untuk memilih gambar.</small></div>`;};
  box.innerHTML='';box.appendChild(img);img.src=charImg(id);
}
let shownHero='';
function heroUpdate(){
  const id=charId(),key=id+'|'+charImg(id).slice(-40),box=$('#heroBox');
  $('#btnChar').textContent='Karakter: '+CHARS[id].n;box.style.setProperty('--aura',CHARS[id].aura);
  if(key!==shownHero){shownHero=key;heroPicture(box,id);}
}
function openChars(){
  const b=modal('Jenis Karakter',`<div class="chars">${Object.entries(CHARS).map(([id,c])=>`<div class="chr" style="--aura:${c.aura}"><div class="pv" data-pv="${id}"></div><b>${c.n}</b><small>${c.d}</small>
    ${id!=='pendekar'?`<label class="btn gray sm">🖼️ Pilih gambar karakter<input type="file" accept="image/*" data-up="${id}" hidden></label>`:''}
    <button class="btn" data-use="${id}" ${id===charId()?'disabled':''}>${id===charId()?'Sedang dipakai':'Pakai'}</button></div>`).join('')}</div>
    <p style="font-size:12px;color:var(--mu);text-align:center">Gambar yang dipilih hanya tersimpan di perangkat ini. Agar tampil untuk semua pemain, taruh file <b>luofeng.png</b> di folder yang sama dengan index.html.</p>`);
  b.querySelectorAll('[data-pv]').forEach(x=>{const id=x.dataset.pv,img=new Image();img.alt=CHARS[id].n;img.onerror=()=>x.textContent='Belum ada gambar';x.appendChild(img);img.src=charImg(id);});
  b.querySelectorAll('[data-use]').forEach(x=>x.onclick=async()=>{x.disabled=true;await sync();const ok=await saveSettings({char:x.dataset.use});refreshStats();homeUpdate();if(ok)toast(curChar().n+' dipakai');openChars();});
  b.querySelectorAll('input[data-up]').forEach(x=>x.onchange=()=>{
    const f=x.files[0];if(!f)return;const url=URL.createObjectURL(f),img=new Image();
    img.onload=()=>{const k=Math.min(1,700/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      if(!lsSet('cts_img_'+x.dataset.up,c.toDataURL('image/png')))return toast('Gambar terlalu besar atau penyimpanan diblokir.');
      shownHero='';homeUpdate();openChars();};
    img.onerror=()=>toast('File itu bukan gambar yang bisa dibaca.');img.src=url;});
}

/* ============ DETAIL BARANG ============ */
const TYPE_N={weapon:'Senjata',armor:'Armor',skill:'Skill Aktif'};
function closeDetail(){$('#detail').hidden=true;$('#detail').innerHTML='';}
$('#detail').onclick=e=>{if(e.target.id==='detail'||e.target.closest('[data-x]'))closeDetail();};
function showDetail(itemId,inv,actions){
  const it=S.items[itemId],lv=inv?inv.level:1,max=lv>=S.cfg.max_item_level,eq=S.P.equipment||{};
  const m=l=>1+0.25*(l-1),sm=l=>it.skill_mult*(1+0.2*(l-1));
  const worn=it.type!=='skill'&&eq[it.type]&&invById(eq[it.type]);
  const rows=[['Jenis',TYPE_N[it.type]],['Kelangkaan',it.rarity.toUpperCase()],['Level',inv?`${lv} / ${S.cfg.max_item_level}`:'1 (baru)']];
  for(const [k,n] of [['atk','⚔️ Serangan'],['hp','❤️ HP'],['def','🛡️ Pertahanan']]){
    const v=Math.round((it[k]||0)*m(lv)),w=worn&&worn.id!==inv?.id?v-itemStat(worn,k):null;
    if(!v&&!w)continue;
    let t=fmt(v);if(inv&&!max)t+=` <span class="up">→ ${fmt(Math.round(it[k]*m(lv+1)))}</span>`;
    if(w)t+=` <small class="${w>0?'up':'down'}">(${w>0?'+':'−'}${fmt(Math.abs(w))} vs dipakai)</small>`;
    rows.push([n,t]);
  }
  if(it.type==='skill'){
    rows.push(['Elemen',`${EL[it.element]?.i||''} ${EL[it.element]?.n||'-'}`],['Pengali damage',`x${sm(lv).toFixed(2)}${inv&&!max?` <span class="up">→ x${sm(lv+1).toFixed(2)}</span>`:''}`],
      ['Perkiraan damage',fmt(S.hs.atk*sm(lv))],['Jeda (cooldown)',it.cooldown+' detik']);
  }
  if(inv&&!max)rows.push(['Biaya upgrade','🪙 '+fmt(upCost(inv))]);
  if(!inv)rows.push(['Harga',(it.currency==='gems'?'💎 ':'🪙 ')+fmt(it.price)]);
  const pas=it.type==='skill'?'':`<h4>Skill pasif</h4>${inv?((inv.passives||[]).map(p=>`<div class="drow"><span>${EL[p.el]?.i} ${EL[p.el]?.n} <small>${EL[p.el]?.d}</small></span><b>${(p.pow*(1+0.05*(lv-1))).toFixed(1)}%</b></div>`).join('')||'<small>Tidak ada.</small>'):'<small style="color:var(--mu)">Elemen pasif ditentukan acak saat dibeli.</small>'}`;
  const d=$('#detail');
  d.innerHTML=`<div class="dbox" style="--rc:${RCOL[it.rarity]}"><div class="dic">${esc(it.icon)}</div><div class="dname">${esc(it.name)}</div>
    <div style="text-align:center;margin-bottom:8px">${rbadge(it.rarity)}</div>${rows.map(r=>`<div class="drow"><span>${r[0]}</span><b style="text-align:right">${r[1]}</b></div>`).join('')}${pas}
    <div class="dact">${actions.map((a,i)=>`<button class="btn ${a.cls||''}" data-a="${i}" ${a.off?'disabled':''}>${a.label}</button>`).join('')}<button class="btn gray" data-x>Tutup</button></div></div>`;
  d.hidden=false;
  d.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>{const a=actions[x.dataset.a];closeDetail();a.run();});
}
/* aksi popup meneruskan klik ke tombol asli pada kartu */
function bindDetail(b){
  b.querySelectorAll('.card[data-info],.card[data-inv]').forEach(c=>c.onclick=e=>{
    if(e.target.closest('button'))return;
    const inv=c.dataset.inv?invById(c.dataset.inv):null;
    const acts=[...c.querySelectorAll('button')].map(btn=>({label:btn.dataset.upi?'Upgrade '+btn.textContent.replace('⬆','').trim():btn.dataset.buy&&!btn.disabled?'Beli '+btn.textContent.trim():btn.textContent.trim(),
      cls:btn.classList.contains('gold')?'gold':'',off:btn.disabled,run:()=>btn.click()}));
    showDetail(inv?inv.item_id:c.dataset.info,inv,acts);
  });
}

/* ============ MODE & PERBURUAN WILAYAH ============ */
/* Nama lokasi diambil dari wiki Swallowed Star; urutan dan tingkat kesulitan adalah rancangan game */
const LOCS=[['Mars',1,5],['Thunder Island',3,1],['Black Dragon Mountain Island',6,2],['Black Dragon Mountain Empire',9,3],['Cang Lan Planet',12,4],['Qian Hua Planet',16,2],['Horned Dragon Planet',20,5],['Virtual Universe',25,1],['Ganwu Universe Country',30,0],['Star Fragment 80389081',36,4],['Blood River World',42,3],['Sky Mountain',49,6],['Heaven and Earth Secret Realm',56,2],['Primal Secret Realm',64,6],['Last Phase Secret Realm',72,0],['Absolute Beginning Secret Realm',81,1],['Continent of Origin',90,5]].map(([n,lv,th])=>({n,lv,th}));
const HUNT_N=8; /* musuh biasa sebelum penguasa wilayah */
const huntDone=()=>Math.min(LOCS.length,Math.max(Number(S.P.settings?.hunt)||0,Number(lsGet('cts_hunt_'+S.P.id))||0));
const huntReward=l=>({gold:Math.floor((80+Math.pow(l.lv,1.5)*25)*S.cfg.gold_mult),exp:Math.floor((60+Math.pow(l.lv,1.4)*20)*S.cfg.exp_mult)});
function openModes(){
  const b=modal('Pilih Mode',`<div class="modes">
    <button class="mode" id="mdStory" style="background:linear-gradient(135deg,#4338ca,#0e7490)"><b>♾️</b><strong>Endless Story</strong><small>Lanjutkan Stage ${Math.max(1,S.stage)} tanpa batas.</small></button>
    <button class="mode" id="mdHunt" style="background:linear-gradient(135deg,#be123c,#c2410c)"><b>🗺️</b><strong>Perburuan Wilayah</strong><small>${huntDone()}/${LOCS.length} wilayah dikuasai.</small></button></div>`);
  b.querySelector('#mdStory').onclick=()=>{closeModal();startGame(null);};
  b.querySelector('#mdHunt').onclick=openHunt;
}
function openHunt(){
  const done=huntDone();
  const b=modal('Perburuan Wilayah',`<p style="margin-top:0;color:var(--mu);font-size:13px">Kalahkan ${HUNT_N} penjaga lalu penguasa wilayah. Wilayah berikutnya terbuka setelah yang sebelumnya dikuasai.</p>
    <div class="locs">${LOCS.map((l,i)=>{const r=huntReward(l),st=i<done?'✅':i===done?'⚔️':'🔒';return`<button class="loc" data-loc="${i}" style="--lc:${THEMES[l.th].acc}" ${i>done?'disabled':''}><strong>${st} ${l.n}</strong><small>Level musuh ${l.lv}</small><small>${i<done?'Hadiah ulang':'Hadiah kuasai'}: 🪙 ${fmt(r.gold*(i<done?.2:1))} • ⭐ ${fmt(r.exp*(i<done?.2:1))}</small></button>`}).join('')}</div>`);
  b.querySelectorAll('[data-loc]').forEach(x=>x.onclick=()=>{const i=+x.dataset.loc;B.over=false;closeModal();startGame(i);});
}
function huntEnd(win){
  const i=B.hunt.i,l=LOCS[i];B.over=true;B.enemy=null;B.atk=[];B.proj=[];inputReset();$('#banner').classList.remove('show');
  let txt='<p>Pasukan penjaga terlalu kuat. Upgrade senjata atau kemampuanmu lalu coba lagi.</p>';
  if(win){
    const first=i>=huntDone(),r=huntReward(l),k=first?1:.2,g=Math.floor(r.gold*k*S.hs.gold),x=Math.floor(r.exp*k);
    S.pending.gold+=g;S.pending.exp+=x;txt=`<p>${first?'Wilayah ini sekarang milikmu!':'Wilayah berhasil dipertahankan.'}</p><p>🪙 +${fmt(g)} • ⭐ +${fmt(x)}</p>`;
    if(first){lsSet('cts_hunt_'+S.P.id,String(i+1));sync().then(()=>saveSettings({hunt:i+1}));}else sync();
    beep(990,.3,'triangle',.06);
  }else sync();
  hud();
  const b=modal(win?'🏆 Wilayah Dikuasai':'💀 Perburuan Gagal',`<div style="text-align:center"><h4 style="justify-content:center">${l.n}</h4>${txt}</div>
    <div class="dact">${win&&i+1<LOCS.length?'<button class="btn gold" id="hNext">Wilayah berikutnya</button>':''}<button class="btn" id="hAgain">Ulangi</button><button class="btn gray" id="hList">Daftar wilayah</button><button class="btn gray" id="hExit">Menu utama</button></div>`);
  const go=n=>{B.over=false;closeModal();startGame(n);};
  if(b.querySelector('#hNext'))b.querySelector('#hNext').onclick=()=>go(i+1);
  b.querySelector('#hAgain').onclick=()=>go(i);b.querySelector('#hList').onclick=openHunt;b.querySelector('#hExit').onclick=closeModal;
}

/* ============ MULAI ============ */
function showRetry(msg){$('#home').hidden=$('#game').hidden=$('#auth').hidden=true;$('#splash').hidden=false;$('#spMsg').textContent=msg;$('#spRetry').hidden=$('#spOther').hidden=false;}
async function boot(){
  $('#splash').hidden=false;$('#spMsg').textContent='Memuat akun...';$('#spRetry').hidden=$('#spOther').hidden=true;
  if(initErr||!sb)return showAuth(initErr);
  try{
    const {data:{session},error}=await sb.auth.getSession();
    if(session){S.user=session.user;await enter();}
    else if(error)showRetry('Belum bisa memulihkan sesi: '+error.message);
    else showAuth('');
  }catch(e){showRetry('Gagal memulai: '+(e.message||e));}
}
$('#spRetry').onclick=boot;
$('#spOther').onclick=async()=>{try{await sb.auth.signOut({scope:'local'});}catch(e){}showAuth('');};
if(sb)sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&S.P){S.P=null;$('#modal').hidden=true;showAuth('Sesi berakhir, silakan masuk lagi.');}});
boot();
</script>
