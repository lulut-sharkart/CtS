<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Conquer the Star</title>
<style>
:root{--bg:#05060f;--p1:#0d1226;--p2:#161d3a;--ln:#2a3566;--tx:#e8ecff;--mu:#8d97c4;--ac:#6ea8ff;--gd:#fbbf24;--gm:#5eead4;--rd:#f43f5e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:#0a0f20;border:1px solid var(--ln);border-radius:10px;padding:10px;width:100%}
.btn{background:linear-gradient(#3b5bdb,#2b3fa8);border:1px solid #6ea8ff55;border-radius:10px;padding:9px 14px;font-weight:600}
.btn.sm{padding:6px 10px;font-size:13px}.btn.gold{background:linear-gradient(#f59e0b,#b45309)}.btn.red{background:linear-gradient(#e11d48,#9f1239)}.btn.gray{background:#232b52}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{flex:1;background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:8px 6px;font-size:13px;white-space:nowrap}
.tabs button.on{background:#3b5bdb;border-color:#6ea8ff}
.foot{text-align:center;color:var(--mu);font-size:12px;padding:6px}
.av{position:relative;width:52px;height:52px;border-radius:50%;border:2px solid var(--ac);background:var(--p2);font-size:28px;padding:0;flex:none}
.av span{position:absolute;right:-4px;bottom:-4px;background:#3b5bdb;border-radius:8px;font-size:11px;padding:1px 5px;border:1px solid #fff3}
.pinfo{flex:1;min-width:0}.pinfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pinfo small{color:var(--mu);font-size:12px}
.bar{height:6px;background:#0a0f20;border-radius:4px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6ea8ff,#c084fc);width:0}
.cur{display:flex;flex-direction:column;gap:2px;font-size:13px;text-align:right}
.sk{position:relative;width:58px;height:58px;border-radius:50%;background:var(--p2);border:2px solid var(--ln);font-size:26px;overflow:hidden;padding:0}
.sk .cdov{position:absolute;left:0;right:0;bottom:0;background:#000a;height:0}
.sk small{position:absolute;bottom:1px;left:0;right:0;font-size:9px}
#modal{position:absolute;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end}
#modal .box{width:100%;max-height:92%;background:var(--p1);border-top:2px solid var(--ac);border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--ln);font-size:17px}
.mh button{background:none;border:none;font-size:20px}
#mb{padding:12px;overflow-y:auto;flex:1}
.card{display:flex;gap:10px;align-items:center;background:var(--p2);border:1px solid var(--ln);border-left:4px solid var(--rc,#999);border-radius:12px;padding:10px;margin-bottom:8px}
.card .ic{font-size:30px;width:44px;text-align:center;flex:none}.card .in{flex:1;min-width:0;font-size:13px}
.card .in b{font-size:14px}.card .in small{color:var(--mu);display:block}
.chip{display:inline-block;background:#0a0f20;border:1px solid var(--ln);border-radius:8px;padding:2px 6px;font-size:11px;margin:2px 3px 0 0}
.rb{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;color:#000;font-weight:700;margin-left:4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.chips button{flex:none;background:var(--p2);border:1px solid var(--ln);border-radius:16px;padding:4px 10px;font-size:12px}
.chips button.on{background:#3b5bdb}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.st{background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:8px;font-size:13px}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}.avs button{font-size:24px;background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:6px 0}.avs button.on{border-color:var(--gd)}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row>*{flex:1}.row label{flex:0 0 38%;font-size:13px;color:var(--mu)}
h4{margin:12px 0 6px;color:var(--ac)}
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#111a3acc;border:1px solid var(--ac);padding:8px 14px;border-radius:12px;z-index:50;font-size:14px;max-width:90%;text-align:center;pointer-events:none;opacity:0;transition:.25s}
#toast.show{opacity:1}
.me{outline:2px solid var(--gd)}
/* ===== TAMPILAN BARU ===== */
:root{--glass:rgba(18,26,58,.72);--glow:0 0 18px rgba(110,168,255,.35)}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes shine{from{background-position:0 0}to{background-position:200% 0}}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}15%{transform:translate(-50%,-50%) scale(1.1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}
.btn{border-radius:14px;box-shadow:0 4px 0 #1b2766,0 6px 14px #0008;transition:transform .08s,box-shadow .08s,filter .2s;text-shadow:0 1px 2px #0008}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1b2766}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn.gold{box-shadow:0 4px 0 #78350f,0 6px 14px #0008}.btn.gold:active{box-shadow:0 1px 0 #78350f}
.btn.red{box-shadow:0 4px 0 #6b0f2a,0 6px 14px #0008}.btn.gray{box-shadow:0 3px 0 #11162f}
.av{border:2px solid transparent;background:linear-gradient(var(--p2),var(--p2)) padding-box,linear-gradient(135deg,#6ea8ff,#c084fc,#fbbf24) border-box;box-shadow:var(--glow);transition:transform .15s}
.av:active{transform:scale(.92)}
.bar{height:8px;border-radius:6px;box-shadow:inset 0 1px 3px #000}.bar i{border-radius:6px;box-shadow:0 0 8px #c084fc;transition:width .4s}
.cur span{background:#0a0f2088;border:1px solid var(--ln);border-radius:20px;padding:2px 10px;font-weight:600}
#stagebar .dots{display:flex;gap:4px}#stagebar .dots i{width:14px;height:6px;border-radius:3px;background:#2a3566}#stagebar .dots i.on{background:linear-gradient(90deg,#fbbf24,#f97316);box-shadow:0 0 8px #f97316}
#stagebar .pw{color:var(--gd);font-size:12px}
.sk{border-width:3px;box-shadow:0 0 14px #0009,inset 0 0 12px #0008;transition:transform .12s}.sk:active{transform:scale(.9)}
#modal{backdrop-filter:blur(3px);animation:none}
#modal .box{background:linear-gradient(180deg,#151d45,#0d1226 30%);border-top:2px solid transparent;border-image:linear-gradient(90deg,#6ea8ff,#c084fc,#fbbf24) 1;animation:rise .28s ease-out;box-shadow:0 -10px 40px #000a}
.mh{background:#0a0f2066;font-weight:700;letter-spacing:.4px}
.mh button{width:34px;height:34px;border-radius:50%;background:#232b52}
#mb::-webkit-scrollbar{width:6px}#mb::-webkit-scrollbar-thumb{background:#34408a;border-radius:3px}
.card{background:linear-gradient(135deg,color-mix(in srgb,var(--rc,#556) 18%,#161d3a),#161d3a 60%);border-radius:14px;box-shadow:0 2px 10px #0006,inset 0 0 0 1px #ffffff0d;transition:transform .12s}
.card:hover{transform:translateX(2px)}
.card .ic{background:#0a0f2099;border-radius:12px;padding:6px 0;box-shadow:0 0 12px color-mix(in srgb,var(--rc,#556) 55%,transparent);border:1px solid color-mix(in srgb,var(--rc,#556) 60%,transparent)}
.rb{box-shadow:0 0 8px currentColor;letter-spacing:.5px}
.chips button,.tabs button{transition:.15s;border-radius:12px}
.tabs button.on,.chips button.on{background:linear-gradient(135deg,#4f46e5,#7c3aed);border-color:#a78bfa;box-shadow:0 0 12px #7c3aed88}
.st{background:linear-gradient(135deg,#1b2552,#131a3b);border-radius:12px}
h4{display:flex;align-items:center;gap:8px}h4::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--ln),transparent)}
#banner{position:absolute;left:50%;top:38%;z-index:60;pointer-events:none;font-size:26px;font-weight:900;text-align:center;color:#fde68a;text-shadow:0 0 20px #f59e0b,0 3px 0 #78350f;opacity:0;white-space:nowrap}
#banner.show{animation:pop 2s ease-out}
.me{box-shadow:0 0 0 2px var(--gd),0 0 18px #fbbf2466}

#toast{position:absolute;left:50%;transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--ac);padding:8px 14px;border-radius:16px;box-shadow:0 8px 24px #000a;z-index:50;font-size:14px;max-width:90%;text-align:center;pointer-events:none;opacity:0;transition:.25s}
/* ===== LAYAR PENUH, SEMUA RASIO ===== */
:root{--pad:clamp(132px,34vmin,196px);--sk:clamp(54px,13vmin,72px)}
#app{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);box-shadow:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(-30deg)}4%{opacity:1}18%{opacity:0;transform:translate(-460px,266px) rotate(-30deg)}100%{opacity:0}}
.cosmos{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;background:radial-gradient(900px 520px at 15% -10%,#4c1d9577,transparent 60%),radial-gradient(800px 520px at 100% 100%,#0e749066,transparent 60%),radial-gradient(600px 400px at 50% 55%,#1e1b4b66,transparent),#04050d}
.cosmos::before,.cosmos::after{content:"";position:fixed;inset:-10%;pointer-events:none;background-image:radial-gradient(2px 2px at 12% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 12%,#9cc2ff,transparent),radial-gradient(2px 2px at 40% 66%,#fff,transparent),radial-gradient(1.5px 1.5px at 86% 58%,#e0b3ff,transparent),radial-gradient(1px 1px at 8% 86%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 92%,#fff,transparent),radial-gradient(1px 1px at 28% 38%,#fff,transparent),radial-gradient(1.5px 1.5px at 92% 28%,#fff,transparent);animation:twinkle 4s infinite}
.cosmos::after{animation-delay:2s;transform:scale(1.35) rotate(9deg)}
.shoot{position:fixed;width:130px;height:2px;background:linear-gradient(90deg,#fff,transparent);opacity:0;pointer-events:none;animation:shoot 7s linear infinite}
.shoot.s1{top:10%;left:78%}.shoot.s2{top:34%;left:96%;animation-delay:3.5s}
.emblem{width:92px;height:92px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:46px;position:relative;isolation:isolate;box-shadow:0 0 44px #7c3aed88}
.emblem::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(#6ea8ff,#c084fc,#fbbf24,#6ea8ff);z-index:-2;animation:spin 6s linear infinite}
.emblem::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#241a5e,#0a0e22);z-index:-1}
.emblem span{animation:floaty 3s ease-in-out infinite;filter:drop-shadow(0 0 14px #fbbf24aa)}
.ttl,#auth h1{margin:0;text-align:center;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#6ea8ff,#c084fc,#fbbf24,#6ea8ff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite;filter:drop-shadow(0 0 18px #6ea8ff55)}
#auth h1{font-size:clamp(30px,8vmin,42px)}
.ttl{font-size:clamp(36px,10vmin,58px);line-height:1}
/* login */
#auth{display:flex;padding:calc(18px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}
.authWrap{position:relative;z-index:1;margin:auto;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;flex-direction:column;gap:8px}
.sub{text-align:center;color:var(--mu);margin:0;font-size:14px}
.card-auth{background:rgba(14,20,48,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #ffffff1f;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px #000a,inset 0 1px 0 #ffffff14}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:#0a0f20;border-radius:14px;padding:4px;border:1px solid var(--ln)}
.seg button{position:relative;z-index:1;background:none;border:0;padding:10px;font-weight:700;color:var(--mu);transition:color .2s}
.seg button.on{color:#fff}
.seg .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:11px;background:linear-gradient(135deg,#4f46e5,#7c3aed);box-shadow:0 0 16px #7c3aed88;transition:transform .25s cubic-bezier(.3,.9,.3,1)}
.seg.reg .pill{transform:translateX(100%)}
.fld{position:relative;display:flex;align-items:center}
.fld .ico{position:absolute;left:14px;opacity:.85;pointer-events:none}
.fld input{padding:14px 44px 14px 42px;border-radius:14px;background:#0a0f20cc;border:1px solid var(--ln);transition:.2s}
.fld input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px #6ea8ff33}
.eye{position:absolute;right:6px;background:none;border:0;font-size:18px;padding:8px;opacity:.85}
#btnAuth{padding:14px;font-size:17px;font-weight:800;letter-spacing:.5px;background:linear-gradient(135deg,#6366f1,#a855f7,#ec4899);border-color:#ffffff33}
.or{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--ln),transparent)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f2937;border:0;border-radius:14px;padding:12px;font-weight:700;box-shadow:0 4px 0 #9ca3af,0 8px 18px #0006;transition:transform .08s,box-shadow .08s}
.gbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #9ca3af}
#authMsg{min-height:20px;text-align:center;color:#fca5a5;font-size:14px}
.authWrap .foot{padding:0}
/* menu utama */
#home{display:flex;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.homeWrap{position:relative;z-index:1;margin:auto;width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px}
.homeL,.homeR{display:flex;flex-direction:column;gap:12px}
.homeL{align-items:center;text-align:center}
.playBtn{width:100%;padding:18px;border-radius:18px;font-size:22px;font-weight:900;letter-spacing:3px;border:1px solid #ffffff44;background:linear-gradient(135deg,#f59e0b,#ef4444,#ec4899);box-shadow:0 6px 0 #7c1d1d,0 12px 30px #ef444466;animation:pulse 2s ease-in-out infinite;text-shadow:0 2px 4px #0008}
.playBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #7c1d1d}
.ghost{width:100%;padding:11px;border-radius:14px;background:#ffffff10;border:1px solid #ffffff22;font-weight:600;color:#cdd6ff}
.pcard{display:flex;align-items:center;gap:10px;background:rgba(14,20,48,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #ffffff1f;border-radius:18px;padding:12px;box-shadow:0 10px 30px #0008}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mstats div{background:rgba(14,20,48,.6);border:1px solid #ffffff14;border-radius:14px;padding:8px 4px;text-align:center;font-size:18px}
.mstats small{display:block;color:var(--mu);font-size:11px}.mstats b{display:block;font-size:15px}
.mgrid,.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:16px;background:linear-gradient(180deg,#1b2552,#131a3b);border:1px solid #34408a;box-shadow:0 4px 0 #0a0f24;font-weight:700;font-size:13px;color:#cdd6ff;transition:transform .08s,box-shadow .08s,border-color .2s}
.tile b{font-size:28px;font-weight:400;filter:drop-shadow(0 2px 4px #000a)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #0a0f24}.tile:hover{border-color:var(--ac)}
/* game layar penuh */
#game{position:absolute;inset:0;display:block;height:auto}
#cvwrap{position:absolute;inset:0;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hudTop{position:absolute;left:0;right:0;top:0;z-index:5;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);pointer-events:none;background:linear-gradient(180deg,#05060fe0,#05060f00)}
#hudTop>*{pointer-events:auto}
#top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:none;border:0;box-shadow:none}
#top .av{width:46px;height:46px;font-size:24px}
.cur{flex-direction:row;gap:6px}
.cur span{font-size:12px;padding:2px 8px}
.ib{width:40px;height:40px;border-radius:50%;flex:none;padding:0;font-size:18px;background:rgba(18,26,58,.72);border:1px solid #ffffff2a;backdrop-filter:blur(6px);box-shadow:0 2px 8px #0008}
.ib:active{transform:scale(.92)}
#stagebar{display:flex;justify-content:center;align-items:center;gap:10px;background:none;padding:0 10px 6px;font-weight:700;font-size:13px;color:var(--tx);text-shadow:0 1px 3px #000;pointer-events:none}
#pad{position:absolute;left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));width:var(--pad);height:var(--pad);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:4px;z-index:6;touch-action:none;user-select:none;-webkit-user-select:none}
#pad button{background:rgba(18,26,58,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:2px solid #ffffff2a;border-radius:16px;font-size:calc(var(--pad)/6.5);color:#dbe4ff;display:grid;place-items:center;padding:0;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 3px 0 #0008;transition:transform .05s,background .1s}
#pad button.on{background:rgba(110,168,255,.55);border-color:#9cc2ff;transform:scale(.93)}
#pad [data-d=up]{grid-area:1/2}#pad [data-d=left]{grid-area:2/1}#pad [data-d=right]{grid-area:2/3}#pad [data-d=down]{grid-area:3/2}
#pad .pc{grid-area:2/2;border-radius:50%;background:#ffffff12;margin:6px}
#skillbar{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:10px;align-items:flex-end;padding:0;background:none}
.sk{width:var(--sk);height:var(--sk)}
@media (max-aspect-ratio:1/1){#skillbar{flex-direction:column}}
@media (max-height:430px){.ib{width:34px;height:34px;font-size:16px}#top .av{width:40px;height:40px;font-size:20px}}
/* modal & toast menyesuaikan layar */
#modal{justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
#modal .box{max-width:640px}
@media (max-height:520px) and (orientation:landscape){#modal{align-items:center}#modal .box{max-height:94%;border-radius:18px;border:2px solid var(--ac);border-image:none}}
#toast{top:calc(env(safe-area-inset-top) + 84px)}
/* landscape pendek: login & menu 2 kolom */
@media (max-height:520px) and (orientation:landscape){
  .authWrap{max-width:780px;display:grid;grid-template-columns:1fr 1fr;align-items:center;column-gap:26px;row-gap:6px}
  .authWrap .foot{grid-column:1/-1}.emblem{width:70px;height:70px;font-size:34px}
  .homeWrap{max-width:880px;flex-direction:row;align-items:center;gap:26px}.homeL,.homeR{flex:1}
}
@media (min-width:900px) and (min-height:640px){.authWrap{max-width:440px}.homeWrap{max-width:520px}}
/* cara bermain */
.how .hr{display:flex;align-items:center;gap:12px;margin:8px 0;font-size:14px}
.how .hr span{flex:1}
kbd{display:inline-block;min-width:56px;text-align:center;background:#0a0f20;border:1px solid var(--ln);border-bottom-width:3px;border-radius:8px;padding:4px 8px;font:600 13px system-ui;color:var(--tx);flex:none}
</style>
</head>
<body>
<div id="app">

<section id="auth" class="cosmos">
  <div class="shoot s1"></div><div class="shoot s2"></div>
  <div class="authWrap">
    <div class="brand">
      <div class="emblem"><span>🌟</span></div>
      <h1>Conquer the Star</h1>
      <p class="sub">Kultivasi, kumpulkan kekuatan, taklukkan bintang.</p>

  const eq=S.P.equipment||{},t={};
  for(const id of [eq.weapon,eq.armor]){const inv=id&&invById(id);if(!inv)continue;
    for(const p of inv.passives||[])t[p.el]=(t[p.el]||0)+p.pow*(1+0.05*(inv.level-1));}

}

async function sync(){
  while(S.syncing)await sleep(80);
  if(!S.P)return;const sn={...S.pending};
  if(!sn.gold&&!sn.exp&&!sn.kills&&S.stage===S.P.stage)return;
  S.syncing=true;S.pending={gold:0,exp:0,kills:0};
  const {data,error}=await sb.rpc('save_progress',{p_exp:sn.exp,p_gold:sn.gold,p_kills:sn.kills,p_stage:S.stage});
  S.syncing=false;
  if(error){S.pending.gold+=sn.gold;S.pending.exp+=sn.exp;S.pending.kills+=sn.kills;return;}
  S.P=data;hud();
}

/* ---- Serangan musuh: tiap jenis dihindari dengan gerakan dpad berbeda ---- */
const PJ={low:{w:34,y:0,h:16,v:360,col:'#fb923c'},wall:{w:30,y:0,h:70,v:330,col:'#f43f5e'},bolt:{w:36,y:58,h:22,v:340,col:'#a78bfa'},orb:{w:26,y:30,h:20,v:320,col:'#22d3ee'}};
const TG={low:['▲','#fb923c'],wall:['▲▲','#f43f5e'],bolt:['▼','#a78bfa'],orb:['▼▼','#22d3ee'],rush:['◀◀','#fbbf24']};
function enemyDmg(e){const H=S.hs;return Math.max(1,Math.floor(e.atk*(1-H.weak/100)*(1-H.red/100)-H.def*0.6));}
function queueAttack(e){
  const s=S.stage,pool=s<3?['low','bolt']:s<8?['low','bolt','orb','rush']:['low','bolt','orb','rush','wall'];
  for(let i=0;i<(e.boss?2:1);i++)B.atk.push({type:pool[Math.floor(Math.random()*pool.length)],t:.55+i*.7});
}
function fireAttack(a){
  const e=B.enemy;if(!e)return;B.eSw=1;const d=enemyDmg(e);beep(200,.08,'sawtooth',.04);
  if(a.type==='rush'){e.rs=1;e.rh=0;e.rd=d;return;}
  const q=PJ[a.type];B.proj.push({k:a.type,x:e.x-18,y:q.y,w:q.w,h:q.h,v:q.v,col:q.col,d});
}
function strike(d){
  const H=S.hs;B.hp-=d;B.hitFlash=.25;B.hurtInv=.5;B.counter=0;
  fxText(B.hx,GYv-B.hy-95,'-'+d,'#f87171');beep(140,.1,'sawtooth',.05);try{navigator.vibrate&&navigator.vibrate(40);}catch(e){}
  if(B.hp<=0){S.stage=Math.max(1,S.stage-1);B.k=0;B.hp=H.hp;B.enemy=null;B.atk=[];B.proj=[];B.spawnT=.8;toast('💀 Kamu kalah! Kembali ke stage '+S.stage);}
}
function dodge(){B.counter=1;fxText(B.hx,GYv-B.hy-100,'DODGE!','#67e8f9',true);beep(880,.08,'triangle',.04);}
function startDash(dir){
  B.dashDir=dir;B.dashT=.18;B.dashSpd=dir>0?470:610;B.dashCd=.7;B.inv=.34;beep(300,.1,'sawtooth',.03);
  B.fx.push({k:'r',x:B.hx,y:GYv-B.hy-30,r:6,life:.3,col:'#93c5fd'});
  const e=B.enemy;if(dir>0&&e&&e.x-B.hx<190){B.heroSw=1;dealDamage(Math.floor(S.hs.atk*1.8),'#93c5fd',true);}
}

/* ---- Kontrol dpad: ketuk 2x = gerakan khusus ---- */
const lastP={up:-1e9,down:-1e9,left:-1e9,right:-1e9};
function inputReset(){
  B.held.left=B.held.right=false;B.downHeld=false;B.proneMode=false;
  document.querySelectorAll('#pad button').forEach(b=>b.classList.remove('on'));
}
function press(d){
  if(!S.P||$('#game').hidden||!$('#modal').hidden)return;
  const now=performance.now(),dbl=now-lastP[d]<DBL;lastP[d]=dbl?-1e9:now;
  if(d==='up'){
    if(B.hy<=0&&B.vy<=0){B.vy=dbl?JV_H:JV_N;B.hy=.01;B.jt=dbl?2:1;B.jage=0;beep(dbl?700:520,.08,'triangle',.04);}
    else if(dbl&&B.jt===1&&B.jage<.35){B.vy=JV_H;B.jt=2;beep(760,.08,'triangle',.04);}
  }else if(d==='down'){
    B.downHeld=true;
    if(B.hy>0)B.vy=Math.min(B.vy,-900);
    else if(dbl){B.proneMode=true;B.proneT=.6;}
    else B.crouchT=.25;
  }else{
    B.held[d]=true;
    if(dbl&&B.dashCd<=0)startDash(d==='right'?1:-1);
  }
}
function release(d){if(d==='down'){B.downHeld=false;B.proneMode=false;}else if(d==='left'||d==='right')B.held[d]=false;}
document.querySelectorAll('#pad button').forEach(b=>{
  const d=b.dataset.d,up=()=>{b.classList.remove('on');release(d);};
  b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(_){}b.classList.add('on');press(d);});
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
const KEYS={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};
window.addEventListener('keydown',e=>{
  const t=e.target.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
  if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();else if(!$('#game').hidden)openPause();return;}
  if(!S.P||$('#game').hidden||!$('#modal').hidden)return;
  const d=KEYS[e.key];
  if(d){e.preventDefault();if(!e.repeat){press(d);const bt=$(`#pad [data-d=${d}]`);bt&&bt.classList.add('on');}}
  else if(e.key==='1'||e.key==='2'||e.key==='3')castSkill(+e.key-1);
});
window.addEventListener('keyup',e=>{const d=KEYS[e.key];if(d){release(d);const bt=$(`#pad [data-d=${d}]`);bt&&bt.classList.remove('on');}});
window.addEventListener('blur',inputReset);

/* ---- Update ---- */
function update(dt){
  if(!S.hs)return;B.t+=dt;const H=S.hs;
  B.dashCd=Math.max(0,B.dashCd-dt);B.inv=Math.max(0,B.inv-dt);B.hurtInv=Math.max(0,B.hurtInv-dt);
  B.proneT=Math.max(0,B.proneT-dt);B.crouchT=Math.max(0,B.crouchT-dt);B.jage+=dt;
  if(B.hy>0||B.vy>0){B.vy-=GRAV*dt;B.hy+=B.vy*dt;if(B.hy<=0){B.hy=0;B.vy=0;B.jt=0;}}
  B.pose=B.dashT>0?'dash':B.hy>0?'jump':(B.proneMode||B.proneT>0)?'prone':(B.downHeld||B.crouchT>0)?'crouch':'stand';
  let vx=0;
  if(B.dashT>0){B.dashT-=dt;vx=B.dashDir*B.dashSpd;B.ghost.push({x:B.hx,y:B.hy,a:.5});}
  else{const sp=B.pose==='prone'?80:B.pose==='crouch'?115:190;vx=((B.held.right?1:0)-(B.held.left?1:0))*sp;if(!vx)vx=(HOME()-B.hx)*.7;}
  B.hx=Math.max(XMIN(),Math.min(XMAX(),B.hx+vx*dt));
  B.ghost.forEach(g=>g.a-=dt*2.2);B.ghost=B.ghost.filter(g=>g.a>0).slice(-8);
  const hx=B.hx;
  B.scroll+=dt*(B.enemy&&B.enemy.x<=hx+110?0:60);
  B.hp=Math.min(H.hp,B.hp+H.hp*H.regen*dt);B.heroSw=Math.max(0,B.heroSw-dt*4);B.eSw=Math.max(0,B.eSw-dt*4);
  for(let i=0;i<3;i++)if(B.cd[i]>0)B.cd[i]-=dt;
  if(!B.enemy){B.spawnT-=dt;if(B.spawnT<=0)spawn();}
  else{
    const e=B.enemy,engaged=e.x-hx<110&&!e.rs;
    if(e.rs===1){e.x-=900*dt;if(e.x-hx<=36){e.x=hx+36;e.rs=2;if(!e.rh){e.rh=1;if(B.inv>0)dodge();else if(B.hurtInv<=0)strike(e.rd);}}}
    else if(e.rs===2){e.x+=320*dt;if(e.x-hx>=95){e.x=hx+95;e.rs=0;}}
    else{if(!engaged)e.x-=dt*120;else e.x=Math.max(e.x-dt*30,hx+95);}
    if(engaged){
      B.aT+=dt;
      if(B.aT>=1/H.aspd){B.aT=0;B.heroSw=1;const crit=B.counter>0||Math.random()*100<H.crit;B.counter=0;
        let d=H.atk*(0.9+Math.random()*.2);if(crit)d*=H.critDmg/100;d=Math.max(1,Math.floor(d));beep(crit?520:260,.04);dealDamage(d,crit?'#fde047':'#fff',crit);}
      for(let i=0;i<3;i++)if(B.cd[i]<=0&&B.enemy)castSkill(i);
      if(B.enemy){B.eT+=dt;if(B.eT>=(e.boss?2.2:1.3)){B.eT=0;queueAttack(e);}}
    }
  }
  for(const a of B.atk){a.t-=dt;if(a.t<=0){a.done=true;fireAttack(a);}}
  B.atk=B.atk.filter(a=>!a.done);
  for(const p of B.proj){
    p.x-=p.v*dt;
    if(!p.hit&&!p.pass){
      const top=B.hy+(HERO_H[B.pose]||80);
      if(Math.abs(p.x-hx)<p.w/2+13&&top>p.y&&B.hy<p.y+p.h){
        if(B.inv>0){}else if(B.hurtInv>0){p.hit=true;}else{p.hit=true;strike(p.d);}
      }else if(p.x<hx-p.w/2-13){p.pass=true;dodge();}
    }
    if(p.hit||p.x<-60)p.dead=true;
  }
  B.proj=B.proj.filter(p=>!p.dead);
  B.hitFlash=Math.max(0,B.hitFlash-dt);
  B.fx.forEach(f=>{f.life-=dt;if(f.k==='t')f.y-=dt*40;else f.r+=dt*(f.big?260:120);});B.fx=B.fx.filter(f=>f.life>0);
  hudT-=dt;if(hudT<=0){hudT=.25;hud();updCd();}
  hsT-=dt;if(hsT<=0){hsT=1;refreshStats();}
}

/* ---- Gambar ---- */
function stick(x,y,sc,col,o){
  const run=o.run?Math.sin(B.t*12):0,hy=y-52*sc,d=o.dir,sw=o.sw||0;
  cx.lineCap='round';cx.lineWidth=3*sc;cx.strokeStyle=col;
  cx.beginPath();cx.moveTo(x,y-26*sc);cx.lineTo(x+run*10*sc,y);cx.moveTo(x,y-26*sc);cx.lineTo(x-run*10*sc,y);cx.stroke();
  if(o.body){cx.strokeStyle=o.body;cx.lineWidth=6*sc;cx.shadowColor=o.body;cx.shadowBlur=8;}
  cx.beginPath();cx.moveTo(x,hy+10*sc);cx.lineTo(x,y-26*sc);cx.stroke();cx.shadowBlur=0;
  cx.strokeStyle=col;cx.lineWidth=3*sc;
  const hx2=x+d*(10+sw*16)*sc,hy2=hy+22*sc-sw*10*sc;
  cx.beginPath();cx.moveTo(x,hy+18*sc);cx.lineTo(hx2,hy2);cx.moveTo(x,hy+18*sc);cx.lineTo(x-d*8*sc,hy+30*sc+run*4*sc);cx.stroke();
  cx.beginPath();cx.arc(x,hy,10*sc,0,7);cx.fillStyle='#0b0f1e';cx.fill();cx.stroke();
  if(o.weapon){const a=-1.1+sw*1.9,L=(o.wl||30)*sc;cx.strokeStyle=o.weapon;cx.lineWidth=3.5*sc;cx.shadowColor=o.weapon;cx.shadowBlur=10;
    cx.beginPath();cx.moveTo(hx2,hy2);cx.lineTo(hx2+Math.cos(a)*L*d,hy2+Math.sin(a)*L);cx.stroke();cx.shadowBlur=0;}
  if(o.horns){cx.fillStyle=col;cx.beginPath();cx.moveTo(x-8*sc,hy-6*sc);cx.lineTo(x-5*sc,hy-18*sc);cx.lineTo(x-1*sc,hy-9*sc);cx.moveTo(x+8*sc,hy-6*sc);cx.lineTo(x+5*sc,hy-18*sc);cx.lineTo(x+1*sc,hy-9*sc);cx.fill();}
  if(o.eyes){cx.fillStyle='#fecaca';cx.fillRect(x-4*sc,hy-2*sc,2.5*sc,2.5*sc);cx.fillRect(x+2*sc,hy-2*sc,2.5*sc,2.5*sc);}
}
function bar(x,y,w,p,col){cx.fillStyle='#000a';cx.fillRect(x-w/2,y,w,6);cx.fillStyle=col;cx.fillRect(x-w/2,y,w*Math.max(0,Math.min(1,p)),6);}
function ridge(col,amp,fr,par,base,gy){
  cx.fillStyle=col;cx.beginPath();cx.moveTo(0,gy);
  for(let x=0;x<=W+12;x+=12){const u=(x+B.scroll*par)*fr;cx.lineTo(x,gy-base-amp*(Math.sin(u)+Math.sin(u*2.3+1)*.5));}
  cx.lineTo(W+12,gy);cx.closePath();cx.fill();
}
function drawProj(p,gy){
  const cxp=p.x,cyp=gy-p.y-p.h/2;cx.shadowColor=p.col;cx.shadowBlur=14;cx.fillStyle=p.col;
  if(p.k==='wall'){const g=cx.createLinearGradient(0,gy-p.h,0,gy);g.addColorStop(0,'#fecdd3');g.addColorStop(1,p.col);cx.fillStyle=g;
    cx.beginPath();cx.moveTo(cxp-p.w/2,gy);cx.lineTo(cxp-p.w/2,gy-p.h+10);cx.lineTo(cxp-p.w/4,gy-p.h);cx.lineTo(cxp,gy-p.h+12);cx.lineTo(cxp+p.w/4,gy-p.h-4);cx.lineTo(cxp+p.w/2,gy-p.h+10);cx.lineTo(cxp+p.w/2,gy);cx.closePath();cx.fill();}
  else if(p.k==='low'){cx.beginPath();cx.moveTo(cxp-p.w/2,gy);cx.lineTo(cxp-4,gy-p.h);cx.lineTo(cxp+2,gy-8);cx.lineTo(cxp+p.w/2,gy-p.h*.7);cx.lineTo(cxp+p.w/2,gy);cx.closePath();cx.fill();}
  else if(p.k==='bolt'){cx.beginPath();cx.moveTo(cxp-p.w/2,cyp);cx.lineTo(cxp+4,cyp-p.h/2);cx.lineTo(cxp+p.w/2,cyp);cx.lineTo(cxp+4,cyp+p.h/2);cx.closePath();cx.fill();
    cx.globalAlpha=.4;cx.fillRect(cxp+p.w/2,cyp-2,26,4);cx.globalAlpha=1;}
  else{cx.beginPath();cx.arc(cxp,cyp,p.h/2+2,0,7);cx.fill();cx.fillStyle='#ecfeff';cx.beginPath();cx.arc(cxp-2,cyp-2,4,0,7);cx.fill();}
  cx.shadowBlur=0;
}
function draw(){
  const gy=GYv,g=cx.createLinearGradient(0,0,0,gy);g.addColorStop(0,'#070a1f');g.addColorStop(1,'#241552');cx.fillStyle=g;cx.fillRect(0,0,W,Hh);
  cx.fillStyle='#fff';for(const s of stars){const x=((s.x-B.scroll*s.v/60)%W+W)%W;cx.globalAlpha=.4+.6*Math.abs(Math.sin(B.t+s.x));cx.fillRect(x,s.y,s.s,s.s);}cx.globalAlpha=1;
  const px=W*.78,py=gy*.36,pr=Math.max(22,Math.min(46,gy*.12)),pg=cx.createRadialGradient(px-pr*.3,py-pr*.3,pr*.1,px,py,pr);
  pg.addColorStop(0,'#c4b5fd');pg.addColorStop(1,'#4c1d95');cx.fillStyle=pg;cx.shadowColor='#8b5cf6';cx.shadowBlur=30;cx.beginPath();cx.arc(px,py,pr,0,7);cx.fill();cx.shadowBlur=0;
  ridge('#151a40',18,.012,.15,22,gy);ridge('#0f1432',26,.02,.35,6,gy);
  const fg=cx.createLinearGradient(0,gy,0,Hh);fg.addColorStop(0,'#151b3e');fg.addColorStop(1,'#080b1c');cx.fillStyle=fg;cx.fillRect(0,gy,W,Hh-gy);
  cx.strokeStyle='#2a3566';cx.lineWidth=2;cx.beginPath();cx.moveTo(0,gy);cx.lineTo(W,gy);cx.stroke();
  cx.strokeStyle='#1c2448';for(let i=0;i<14;i++){const x=((i*60-B.scroll)%(W+60)+W+60)%(W+60);cx.beginPath();cx.moveTo(x,gy+4);cx.lineTo(x-20,Hh);cx.stroke();}
  if(!S.hs)return;const hx=B.hx,H=S.hs,pose=B.pose;
  const moving=(!B.enemy||B.enemy.x-hx>=110)&&pose==='stand';
  cx.fillStyle='#0009';cx.beginPath();cx.ellipse(hx,gy+3,18*(1-Math.min(B.hy/180,.6)),5,0,0,7);cx.fill();
  for(const gh of B.ghost){cx.globalAlpha=gh.a*.5;stick(gh.x,gy-gh.y,1.25,'#6ea8ff',{dir:1,run:0});}cx.globalAlpha=1;
  if(B.counter>0){cx.strokeStyle='#67e8f9';cx.globalAlpha=.55;cx.lineWidth=2;cx.beginPath();cx.arc(hx,gy-B.hy-38,38+Math.sin(B.t*10)*3,0,7);cx.stroke();cx.globalAlpha=1;}
  cx.save();cx.translate(hx,gy-B.hy);
  if(B.hurtInv>0&&Math.floor(B.t*20)%2)cx.globalAlpha=.4;
  if(pose==='crouch')cx.scale(1,.68);
  else if(pose==='prone'){cx.translate(-26,-5);cx.rotate(Math.PI/2);}
  else if(pose==='dash')cx.rotate(.32*B.dashDir);
  stick(0,0,1.25,B.hitFlash>0?'#f87171':'#e8ecff',{dir:1,run:moving,sw:B.heroSw,body:H.aRar?RCOL[H.aRar]:null,weapon:H.wRar?RCOL[H.wRar]:'#9aa4b2',wl:34});
  cx.restore();cx.globalAlpha=1;
  bar(hx,gy-B.hy-(pose==='prone'?50:pose==='crouch'?82:108),64,B.hp/H.hp,'#4ade80');
  if(B.enemy){const e=B.enemy,sc=e.boss?2:1.1;
    stick(e.x,gy,sc,e.col,{dir:-1,run:e.x-hx>=110||e.rs===1,sw:B.eSw,horns:true,eyes:true,weapon:e.boss?'#fb7185':null,wl:26});
    bar(e.x,gy-(e.boss?120:75)*(e.boss?1.05:1.1),e.boss?90:50,e.hp/e.maxHp,'#f43f5e');
    for(const a of B.atk){if(a.t>.6)continue;const [tx,tc]=TG[a.type],pulse=1+.12*Math.sin(B.t*28),by=gy-(e.boss?150:105);
      cx.save();cx.translate(e.x,by);cx.scale(pulse,pulse);cx.fillStyle='#000c';cx.strokeStyle=tc;cx.lineWidth=2;cx.fillRect(-24,-14,48,28);cx.strokeRect(-24,-14,48,28);
      cx.fillStyle=tc;cx.font='bold 17px system-ui';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(tx,0,1);cx.restore();}}
  for(const p of B.proj)drawProj(p,gy);
  cx.textBaseline='alphabetic';
  for(const f of B.fx){cx.globalAlpha=Math.min(1,f.life*2);
    if(f.k==='t'){cx.font=`bold ${f.big?20:14}px system-ui`;cx.fillStyle=f.col;cx.textAlign='center';cx.fillText(f.txt,f.x,f.y);}
    else{cx.strokeStyle=f.col;cx.lineWidth=f.big?6:3;cx.beginPath();cx.arc(f.x,f.y,f.r,0,7);cx.stroke();}}
  cx.globalAlpha=1;
}
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(S.P&&!$('#game').hidden){if($('#modal').hidden)update(dt);draw();}requestAnimationFrame(loop);}

function renderSkillBar(){
  const bar=$('#skillbar');bar.innerHTML='';

async function adminList(t,q=''){
  const c=ADM[t],box=$('#adBody');box.innerHTML='<p>Memuat...</p>';
  const {data,error}=await sb.from(t).select('*').order(c.order,{ascending:!c.desc}).limit(300);
  if(error){box.innerHTML='<p>'+esc(error.message)+'</p>';return;}
  box.innerHTML=`<div class="row"><input id="adQ" placeholder="Cari..." value="${esc(q)}">${c.noNew?'':'<button class="btn sm" id="adNew" style="flex:0 0 auto">+ Baru</button>'}</div>`+
    data.filter(r=>c.title(r).toLowerCase().includes(q.toLowerCase())).map((r,i)=>`<div class="card" style="--rc:#556"><div class="in"><b>${esc(c.title(r))}</b></div><button class="btn sm" data-e="${esc(r[c.pk])}">Edit</button></div>`).join('');
  $('#adQ').oninput=e=>adminList(t,e.target.value);
  box.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>adminForm(t,data.find(r=>String(r[c.pk])===x.dataset.e)));
  if($('#adNew'))$('#adNew').onclick=()=>adminForm(t,null);
}
function adminForm(t,row){
  const c=ADM[t],isNew=!row,box=$('#adBody');
  box.innerHTML=c.cols.map(([k,ty])=>{
    const v=row?row[k]:(ty==='bool'?true:ty==='json'?'{}':'');const ro=!isNew&&k===c.pk;let f;
    if(ty==='bool')f=`<select data-k="${k}"><option value="true" ${v?'selected':''}>Ya</option><option value="false" ${!v?'selected':''}>Tidak</option></select>`;
    else if(ty.startsWith('sel:'))f=`<select data-k="${k}">${ty.slice(4).split(',').map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
    else if(ty==='json')f=`<textarea data-k="${k}" rows="3">${esc(typeof v==='string'?v:JSON.stringify(v))}</textarea>`;
    else f=`<input data-k="${k}" type="${ty==='text'?'text':'number'}" step="any" value="${esc(v??'')}" ${ro?'disabled':''}>`;
    return`<div class="row"><label>${k}</label>${f}</div>`}).join('')+
    `<div class="row"><button class="btn" id="afS">Simpan</button>${(!isNew&&!c.noDel)?'<button class="btn red" id="afD">Hapus</button>':''}<button class="btn gray" id="afC">Batal</button></div>`;
  $('#afC').onclick=()=>adminList(t);
  $('#afS').onclick=async()=>{
    const o={};try{c.cols.forEach(([k,ty])=>{const el=box.querySelector(`[data-k="${k}"]`);let v=el.value;
      if(ty==='bool')v=v==='true';else if(ty==='int'||ty==='num')v=Number(v);else if(ty==='json')v=JSON.parse(v);else if(v===''&&k==='element')v=null;o[k]=v;});}catch(e){return toast('Format tidak valid: '+e.message);}
    let r;if(t==='profiles'){delete o.id;r=await sb.from(t).update(o).eq('id',row.id);}else r=await sb.from(t).upsert(o);
    if(r.error)return toast(r.error.message);toast('Tersimpan');
    if(t==='profiles'&&row.id===S.user.id)await refreshProfile();else if(t!=='profiles')await loadAll().then(()=>{refreshStats();renderSkillBar();hud();});
    adminList(t);};
  if($('#afD'))$('#afD').onclick=async()=>{if(!confirm('Hapus data ini?'))return;const r=await sb.from(t).delete().eq(c.pk,row[c.pk]);if(r.error)return toast(r.error.message);toast('Dihapus');await loadAll();adminList(t);};
}
async function adminGrant(){
  const box=$('#adBody');
  const {data}=await sb.from('profiles').select('id,username').order('username').limit(300);
  box.innerHTML=`<div class="row"><label>Pemain</label><select id="gU">${(data||[]).map(p=>`<option value="${p.id}">${esc(p.username)}</option>`).join('')}</select></div>
  <div class="row"><label>Barang</label><select id="gI">${Object.values(S.items).sort((a,b)=>a.type.localeCompare(b.type)||RAR.indexOf(a.rarity)-RAR.indexOf(b.rarity)).map(i=>`<option value="${i.id}">${esc(i.name)} [${i.type}/${i.rarity}]</option>`).join('')}</select></div>
  <button class="btn" id="gB" style="width:100%">Beri barang</button>`;
  $('#gB').onclick=async()=>{try{await rpc('admin_grant_item',{p_user:$('#gU').value,p_item:$('#gI').value});toast('Barang diberikan');if($('#gU').value===S.user.id)refreshInv();}catch(e){}};
}

/* ============ MULAI ============ */
(async function boot(){
  showAuth(initErr);
  if(initErr||!sb)return;
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session){S.user=session.user;await enter();}
  }catch(e){showAuth('Gagal memulai: '+(e.message||e));}
})();
</script>
